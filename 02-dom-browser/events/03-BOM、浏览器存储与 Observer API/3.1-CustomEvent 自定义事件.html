<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomEvent 自定义事件</title>
</head>
<body>
    
</body>
<script>
    // ============CustomEvent 自定义事件=============
    console.log("CustomEvent 自定义事件")
    const parent = document.createElement("div");
    const child = document.createElement("button");

    parent.append(child);

    parent.addEventListener("save", event => {
        console.log(event.detail.id);
    });

    const event = new CustomEvent("save", {
        bubbles: true,
        detail: {
            id: 100
        }
    });

    child.dispatchEvent(event);  // 100

    // CustomEvent 和普通 Event 的区别是什么？什么场景下需要自定义事件？
    /*
        Event 和 CustomEvent 都可以用于创建和派发 DOM 事件，其中 CustomEvent 继承自 Event，最主要区别是可以通过 detail 属性携带自定义数据。
        1. 普通 Event 用于表示一个事件，具有 type、target、bubbles、canceable 等基本属性。
        2. CustomEvent 在继承这些能力的基础上，提供了 detail 属性，可以在事件触发时传递业务数据。
        3. 两者都可以通过 dispatchEvent() 主动派发，也可以 addEventListener() 监听，而且都支持冒泡、捕获和取消默认行为等机制。
        4. 自定义事件通常用于组件通信、业务状态变化通知和模块解耦。例如购物车组件添加商品后，可以派发一个 cart:add 事件，
        其他模块监听这个事件并更新界面，而不需要让购物车组件直接调用其他模块的方法。
        需要注意，自定义事件默认不冒泡，如果希望父元素通过事件委托监听，需要显式设置 bubbles: true。
    */
</script>
</html>
