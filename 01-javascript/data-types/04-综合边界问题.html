<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04-综合边界问题</title>
</head>
<body>
    
    
</body>
<script>
    // ============综合边界问题=============
    // 1. 浮点数精度
    console.log("1. 浮点数精度")
    console.log(0.1 + 0.2 === 0.3); // false  0.1 和 0.2 转成二进制都是无限循环小数，存储时只能存储近似值
    console.log(0.1 + 0.2);         // 0.3 ❌ 0.30000000000000004 ✅  
    console.log((0.1 + 0.2).toFixed(1)); // 0。3

    // IEEE 754 浮点数
    /*
        Javascript 中的 Number 类型通常使用 IEEE 754 中的双精度浮点数，即 64 位浮点数。
        1. 它使用 64 个二进制位存储数值。 其中 1 位表示符号位，11 位表示指数位，52 位表示小数部分。对于规格化数，还有 1 位隐含的有效数字，
        因此总共具有 53 位二进制有效精度。
        2. 浮点数存在精度问题。因为计算机采用二进制表示数字，有些小数如 0.1 无法用有限的二进制精确表示，因此存储时有误差。
        3. JavaScript 的最大安全整数是 Number.MAX_SAFE_INTEGER，也就是 2^53 - 1。 超过安全整数范围后，不能保证所有整数都能被精确表示和区分。
    */
    
    // 精度问题与 toFixed() 返回类型
    /*
        1. toFixed() 是 Number 类型提供的数字格式化方法。它可以按照指定的小数位数对数字进行舍入，并在必要时补零。
        2. toFixed() 返回的是字符串。
        3. toFixed() 不能从根本上解决浮点数精度问题。 因为它操作的仍然是二进制浮点数，某些看似应该四舍五入的结果，可能与直觉不一致。
    */

    // 2. 综合类型转换
    console.log("2. 综合类型转换")
    console.log([] + []);  // [] ❌  "" ✅  [] + [] 两个空数组转换为空字符串
    console.log([] + {});  // 0 ❌ [Object Object] ✅  {} 转换为原始值得到的是 "[Object Object]"
    console.log(Boolean("0")); // true
    console.log(Boolean("false")); // true

    // 数组转字符串
    /*
        数组可以通过 toString()、join()、String() 等方式转换为字符串，也可能在字符串拼接等运算中发生隐式类型转换。
        1. 数组的 toString() 方法默认会调用 join()，使用逗号连接数组元素。如 [1, 2, 3].toString() 返回字符串 "1, 2, 3"。
        2. 数组中不同类型的元素会按照相应的规则转换。普通数值和布尔值会转换为字符串；null、undefined 和数组空位会转换为字符串；
        嵌套数组则会递归进行字符串转换。
        3. join() 和 toString() 的区别在于 join() 可以自定义分隔符。
        4. JSON.stringify() 与前两者不同。 它会将数组序列化为 JSON 字符串，保留数组的方括号及 JSON 支持的数据结构。
    */

    // 字符串的布尔转换
    /*
        字符串转换为布尔值时，判断依据是字符串是否为空，而不是字符串的内容。
        1. 空字符串会转换为 false。
        2. 所有非空字符串都是 true。
        3. 只包含空格的字符串也是非空字符串，也是 true。
        4. 字符串的布尔转换既可以通过 Boolean() 或 !! 显式完成，也可以在 if、while、逻辑运算等场景中隐式发生。
    */
</script>
