<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组方法与数据处理</title>
</head>
<body>
    
</body>
<script>
    // ============数组方法与数据处理=============
    // 1. map 与 forEach
    console.log("1. map 与 forEach")
    const nums = [1, 2, 3];

    const result1 = nums.map((value, index) => {
        return value + index;
    });

    const result2 = nums.forEach(value => {
        return value * 2;
    });  // forEach() 方法是对数组的每个元素执行一次给定的函数

    console.log(result1);  // [1, 3, 5]
    console.log(result2);  // [2, 4, 6] ❌  undefined ✅
    console.log(nums);   // [1, 2, 3]

    // map() 和 forEach() 的主要区别是什么？map() 一定不会修改原数组吗？
    /*
        它们都是数组遍历方法，都会对数组中存在的元素执行回调函数，它们的主要区别是返回值和使用目的。
        1. map() 用于数组映射。它会根据回调函数的返回值创建一个新的数组，新数组对应元素就是回调函数的执行结果。
        2. forEach() 主要用于遍历和执行操作。它不会收集回调函数的返回值，方法本身始终返回 undefined。
        3. map() 本本身不会像 sort()、reverse() 那样直接对原数组进行原地重排或修改，但不代表它一定不会修改原数组。
        如果回调函数主动修改原数组，或者修改原数组中对象元素的属性，原数组仍然会受到影响。
        4. map() 返回的是一个新数组，但这是浅层的结果容器。如果回调函数直接返回原来的对象元素，
        那么新旧数组中的对应元素仍然可能引用同一个对象。
    */

    // 2. reduce 的初始值
    console.log("2. reduce 的初始值")
    const nums1 = [10, 20, 30];

    const result11 = nums1.reduce((acc, value, index) => {
        return acc + index;
    });    // 没有给定初始值时，会接受数组的第一个元素作为初始值

    const result22 = nums1.reduce((acc, value, index) => {
        return acc + index;
    }, 0);

    console.log(result11);   // 3 ❌  13 ✅
    console.log(result22);   // 3 

    console.log(
        [].reduce((acc, value) => acc + value, 10)
    );     // 10

    // 省略 initialValue 时，reduce() 会如何确定累加器的初始值和回调起始索引？
    /*
        reduce() 用于将数组中的元素按照回调函数指定的规则，逐步规约为一个最终结果。
        1. 如果提供了 initialValue，累加器回忆这个值作为初始值，回调函数从数组中第一个实际存在的元素开始执行。
        对于普通非稀疏数组，通常从索引 0 开始。
        2. 如果省略initialValue，reduce() 会将数组中第一个实际存在的元素作为累加器的初始值，并从下一个实际存在的元素开始执行回调。
        因此在普通非空、非稀疏数组中，累加器的初始值是 arr[0]，第一次回调的索引是 1。
        3. 如果省略 initialValue，且数组只有一个实际存在的元素，reduce() 会直接返回该元素，不执行回调。
        4. 如果省略 initialValue，且数组没有任何实际存在的元素，包括空数组和全是空槽的稀疏数组，reduce() 会抛出 TypeError。
    */

    // 3. sort 排序与原数组修改
    console.log("3. sort 排序与原数组修改")
    const nums2 = [2, 10, 1];

    const result111 = nums2.sort();  // sort 是原地排序，会修改原数组并返回同一个数组引用

    const result222 = [2, 10, 1].sort((a, b) => a - b);

    console.log(result111);  // [1, 10, 2]
    console.log(result222);  // [1, 2, 10]
    console.log(nums2);      // [2, 10, 1] ❌  [1, 10, 2] ✅

    // 为什么 sort() 默认行为不能直接理解为数值升序排序？如果不能修改原数组，你会怎么写？
    /*
        sort() 默认并不是按照数值大小进行排序，而是将数组元素转换为字符串，再按照字符串的 UTF-16 编码单元顺序进行比较。
        1. 如果需要数值升序，应该传入比较函数 (a, b) => a - b。比较函数返回负数表示 a 排在 b 前面，返回正数表示 a 排在 b 后面，
        返回 0 表示二者排序关系上相等。
        2. sort() 会原地修改数组，并返回排序后的原数组引用。
        4. 可以使用[...arr].sort((a, b) => a - b)，先浅拷贝数组再排序；现代 Javascript 也可以使用 arr.toSorted((a, b) => a - b)，
        它直接返回一个新的排序，不修改原数组。
    */

    // 4. slice 与 splice
    console.log("4. slice 与 splice")
    const arr = [1, 2, 3, 4];

    const removed = arr.splice(1, 2, 9);  // 对于 arr，从索引 1 处删掉两个，插入数字 9；返回的是删掉的内容组成的数组

    console.log(removed);   // [1, 9, 4] ❌  [2, 3] ✅
    console.log(arr);       // [1, 2, 3, 4] ❌  [1, 9, 4] ✅
    console.log(arr.slice(1, 3));  // [1, 4] ❌  [9, 4] ✅  slice 不改变原数组，只是返回切出来的数组

    // slice() 和 splice() 的主要区别是什么？分别返回什么？
    /*
        slice() 和 splice() 都是 Javascript 的数组方法，但它们的主要区别在于是否修改数组，以及返回值不同。
        1. slice(start, end) 用于截取数组中的一部分元素。它不会修改原数组，而是返回一个新数组。
        2. splice(start, deleteCount, ...items) 用于对原数组进行删改操作。它会直接修改原数组，
        可以从指定位置删除元素，也可以插入新元素。
        3. 两者的返回值不同。 slice() 返回截取出来的新数组，而 splice() 返回被删除元素组成的数组。
        即使 splice() 没有删除任何元素，也会返回一个空数组。
        4. slice() 虽然不会修改原数组结构，但它属于浅拷贝。如果截取的元素是对象，那么新旧数组中的元素仍然可能引用
        同一个对象。
    */

    // 5. find、filter、some、every
    const nums3 = [3, 5, 8, 12];

    console.log(nums3.find(x => x > 6));  // 8

    console.log(nums3.filter(x => x > 6)); // [8, 12]

    console.log(nums3.some(x => x % 2 === 0));  // true

    console.log(nums3.every(x => x > 2));  // true

    // 如果只需要判断数组中是否存在满足条件的元素，应该优先使用哪种方法？为什么？
    /*
        优先使用 some() 方法。
        1. some() 语义最准确。它会对数组元素执行回调函数，只要有一个元素满足条件，就返回 true；
        如果所有元素都不满足，就返回 false。
        2. some() 具有短路执行机制。 一旦找到第一个满足条件的元素，就会立即停止遍历，不需要继续检查剩余元素。
        3. 相比 filter()，some() 不需要创建包含匹配元素的新数组。而 filter() 会遍历所有需要处理的元素，
        并返回一个新数组，如果只是判断是否存在，就会进行不必要的工作。
        4. find() 虽然也会在找到第一个匹配元素时停止，但它返回的是元素本身，而不是布尔值。因此，
        如果只需要判断是否存在，some() 的表达更直接。
    */

    // 6. map 与稀疏数组
    console.log("6. map 与稀疏数组")
    const arr1 = [1, , 3];

    const result3 = arr1.map(value => value * 2);  // 空位会被跳过

    console.log(arr1.length);    // 3
    console.log(result3.length);  // 3

    console.log(1 in arr1);  // true ❌  false ✅  in 检查的是索引属性是否存在
    console.log(1 in result3);  // false

    console.log(result3[1]);  // 0 ❌  undefined ✅ 

    // map() 是否会对数组中的每一个索引都执行回调？数组空槽和显式存储的 undefined 有什么区别？
    /*
        map() 并不会对数组中每一个索引执行回调。
        1. map() 会按照索引顺序遍历数组，但只对实际存在的索引属性执行回调。如果某个索引是空槽，那么 map() 通常会跳过这个位置。
        2. 数组空槽和显示存储的 undefined 不一样。空槽表示数组中不存在对应的索引属性，而显式存储 undefined 表示该索引属性确实存在，
        只是它的值为 undefined。
        3. 因此，map() 会跳过空槽，但会对显式存储的 undefined 执行回调。
        4. map() 返回的新数组通常会保留原数组中未被访问的空槽位置，而不会自动将这些空槽填充为 undefined。
    */
</script>
</html>
