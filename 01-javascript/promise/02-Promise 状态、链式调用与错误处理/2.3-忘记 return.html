<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记 return</title>
</head>
<body>
    
</body>
<script>
    // ============忘记 return=============
    console.log("忘记 return")
    Promise.resolve(1)
        .then(value => {
            value + 1;  // 只是计算，没有返回，因此默认返回的是 undefined
        })
        .then(value => {
            console.log(value);
        });
    // 1 ❌  undefined ✅  
    
    // 如果 .then() 回调内部启动了一个异步请求，却没有 return，后续 .then() 会等待它吗？
    /*
        不会。Promise 链式调用是否等待某个异步操作，主要取决于前一个 .then() 回调返回了什么，而不是回调内部是否启动了异步操作。
        1. 每次调用 .then() 都会返回一个新的 Promise，这个新 Promise 的状态由对应回调的执行结果决定。
        2. 如果回调内部启动了异步请求，但没有使用 return，那么回调默认返回 undefined。因此，只要该回调正常执行结束，
        它返回的新 Promise 就会以 undefined 兑现。
        3. 后续 .then() 依赖的是前一个 .then() 返回的新 Promise，而不是回调内部启动所有异步操作，
        所以它不会自动等待那个未返回的请求。
        4. 如果希望后续 .then() 等待请求完成，应该 return 这个请求对应的 Promise。 这样 Promise 链才会采用该 Promise 的最终状态和结果。
    */
</script>
</html>
