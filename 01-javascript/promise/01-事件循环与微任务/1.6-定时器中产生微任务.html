<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时器中产生微任务</title>
</head>
<body>
    
</body>
<script>
    // ============定时器中产生微任务=============
    console.log("定时器中产生微任务")
    setTimeout(() => {
        console.log("timer");

        Promise.resolve().then(() => {
            console.log("micro");
        });
    }, 0);

    Promise.resolve().then(() => {
        console.log("first");
    });

    console.log("sync");
    // sync -> timer -> micro -> first  ❌
    // sync -> first -> timer -> micro  ✅

    // 一个定时器任务结束后，微任务何时执行
    /*
        1. 当一个定时器任务开始执行时，其中的同步代码会先执行完毕。即使执行过程中产生了微任务，
        这些微任务也不会打断当前定时器回调。
        2. 当定时器回调执行结束、Javascript 调用栈清空后，事件循环会进入微任务检查点。此时会依次执行已经入队的微任务。
        3. 如果微任务执行过程中又创建了微任务，新微任务会追加到队列尾部，并在本次微任务检查点内继续执行，直到队列为空。
        4. 只有完成当前微任务检查点后，事件循环才会继续处理后续任务，例如另一个已经到期的定时器回调。
    */
    // 浏览器在执行下一个任务之前，会如何处理已经排队的微任务？
    /*
        在浏览器的事件循环中，一个任务执行完成后，浏览器通常会进入微任务检查点，处理已经排队的微任务，然后才会执行下一个任务。
        1. 微任务不会打断当前正在执行的 JavaScript 任务。 浏览器会先执行完当前任务中的同步代码，
        等 JavaScript 调用栈清空后，再处理微任务。
        2. 进入微任务检查点后，浏览器会按照先进先出（FIFO）的顺序执行微任务。 例如 Promise 的 .then() 回调、
        queueMicrotask() 回调以及 await 恢复执行的代码。
        3. 如果执行微任务期间又产生了新的微任务，新微任务会追加到队列尾部。 浏览器会继续处理这些新微任务，直到微任务队列为空。
        4. 微任务处理完成后，浏览器才会继续后续的事件循环步骤。 此时可能进行页面渲染更新，也可能选择执行下一个任务，例如定时器回调。
    */
</script>
</html>
