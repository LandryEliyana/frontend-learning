<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise 链的多级微任务</title>
</head>
<body>
    
</body>
<script>
    console.log("Promise 链的多级微任务")
    Promise.resolve()
        .then(() => {
            console.log(1);
        })
        .then(() => {
            console.log(2);
        });

    Promise.resolve().then(() => {
        console.log(3);
    });

    console.log(4);
    // 4 -> 3 -> 1 -> 2  ❌
    // 4 -> 1 -> 3 -> 2  ✅

    // 不同 Promise 链的回调入队顺序
    /*
        不同 Promise 链的回调并不是按照整条链依次执行的，而是根据每个 Promise 的状态和微任务实际入队顺序进行调度。
        1. .then() 方法本身是同步调用的，并且会立即返回一个新的 Promise，但传入的回调不会同步执行。
        2. 如果 Promise 已经兑现，那么注册的 .then() 成功回调会被安排为微任务；如果仍处于 Pending 状态，
        则需要等到 Promise 兑现后才能安排回调。
        3. 同一条 Promise 链中的后续回调依赖前一层返回的 Promise。因此，多层 .then() 回调不会在创建链时一次性全部入队，
        而是随着各层 Promise 的状态变化逐步调度。
        4. 不同 Promise 链共享同一个微任务队列，它们之间不存在整条链的优先级。已经入队的回调会按照先进先出（FIFO）的规则执行，
        后续新产生的回调则排在队尾。
    */
    // 为什么连续编写的两个 .then() 回调，不一定连续执行？
    /*
        连续编写的两个 .then() 回调不一定连续执行，是因为 Promise 链式调用中的回调并不是一次性全部进入微任务队列的。
        1. .then() 方法本身是同步调用的，而且每次都会返回一个新的 Promise，但传入的回调是异步执行的。
        2. 对于 p.then(callback1).then(callback2)，第二个 .then() 实际上注册在第一个 .then() 返回的新 Promise 上。 
        因此，callback2 必须等待这个新 Promise 确定结果后，才能被安排执行。
        3. 如果第一个 Promise 已经兑现，callback1 会先被安排为微任务。 但此时 callback2 通常还不能入队，
        因为它依赖的 Promise 仍处于 Pending 状态。
        4. 当 callback1 执行完成并使下一层 Promise 兑现后，才会安排 callback2 对应的微任务。 此时队列中可能已经存在其他微任务，
        所以 callback2 不一定紧跟 callback1 执行。
    */
</script>
</html>
