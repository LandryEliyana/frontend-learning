<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微任务的嵌套调度</title>
</head>
<body>
    
</body>
<script>
    // ============微任务的嵌套调度=============
    console.log("微任务的嵌套调度")
    console.log("A");

    Promise.resolve()
        .then(() => {
            console.log("B");

            queueMicrotask(() => {
                console.log("C");
            });
        })
        .then(() => {
            console.log("D");
        });

    queueMicrotask(() => {
        console.log("E");
    });

    console.log("F");
    // A -> F -> E -> C -> B -> D  ❌
    // A -> F -> B -> E -> C -> D  ✅

    // 微任务入队顺序
    /*
        Javascript 中的微任务通常按照入队顺序先进先出（FIFO）执行，但要注意，代码的书写顺序不一定等于微任务入队顺序。
        1. 当前同步代码会执行。在执行同步代码的过程中，满足执行条件的 Promise .then()回调、queueMicrotask() 回调
        会被安排为微任务。
        2. 微任务按实际入队顺序执行。例如，对已经兑现的 Promise 注册 .then() 回调时，会安排相应的微任务；
        而对于尚未确定结果的 Promise，需要等到它兑现或拒绝之后，才会安排对应的反应回调。
        3. async 函数遇到 await 时会暂停。如果等待的是普通值或者已经兑现的 Promise，其后续执行会被安排为微任务。
        4. 微任务执行期间还可以产生新的微任务。新任务会追加到队列尾部，而不是立即插队执行。在通常的浏览器事件循环中，
        微任务队列会持续处理到清空，然后才能执行后续任务。
    */

    // Promise 链式回调调度
    /*
        1. .then() 方法本身是同步调用的，并且立即会返回一个新的 Promise，但它注册的回调是异步执行的。
        2. 如果调用 .then() 时，上一个 Promise 已经兑现，那么对应的成功回调会被安排为微任务；
        如果上一个 Promise 还处于 Pending 状态，就需要等待它的状态确定后再安排回调。
        3.  链式调用中的多个 .then() 回调不是一次性全部入队的。 通常需要等待前一个回调执行完毕，并且
        它返回的新 Promise 确定结果后，才能安排下一个回调。
        4. 微任务队列按实际入队顺序执行。因此，在两个链式 .then() 之间，可能先执行其他独立 Promise 的回调。
        5. 如果某个 .then() 返回普通值，下一层 Promise 通常会以该值兑现；如果返回 Promise，
        则下一层需要采用这个 Promise 的最终状态。
    */

    // 为什么嵌套创建的微任务不一定先于之前已经入队的微任务执行？
    /*
        Javascript 中，微任务队列通常遵循先进先出（FIFO）的执行规则
        1. 微任务执行期间，如果又创建了新的微任务，新微任务不会立即执行，而是被追加到微任务队列的尾部。
        2. 已经进入队列的微任务具有更早的执行顺序。 即使新微任务是在当前微任务内部创建的，也不会因为代码存在嵌套关系而优先执行。
        3. 当前微任务会先执行完毕，然后事件循环才会从微任务队列中取出下一个任务。
        4. Promise .then()、queueMicrotask() 和 await 恢复操作都会涉及微任务调度，它们的执行顺序主要取决于实际入队时机。
    */
</script>
</html>
