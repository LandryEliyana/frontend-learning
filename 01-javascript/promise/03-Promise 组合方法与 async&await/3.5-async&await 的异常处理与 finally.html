<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>async&await 的异常处理与 finally</title>
</head>
<body>
    
</body>
<script>
    // ============async&await 的异常处理与 finally=============
    console.log("async/await 的异常处理与 finally")
    async function run() {
        try {
            console.log("A");

            await Promise.reject("error");  // 发生异常，后面的会被跳过

            console.log("B");
        } catch (error) {
            console.log(error);
        } finally {
            console.log("C");
        }
    }

    run();

    console.log("D");
    // A -> D -> error -> B -> C ❌  A -> D -> error -> C ✅

    // await 的拒绝处理、try/catch/finally、同步与异步顺序。
    /*
        Javascript 中，await 可以等待 Promise 的结果。如果等待的 Promise 成功兑现，await 表达式就立即得到兑现值；
        如果 Promise 被拒绝，await 会在恢复执行时抛出拒绝的原因。
        1. async 函数调用后立即开始同步执行，直到遇到 await。执行到 await时，会先求值，然后暂停当前异步函数，
        外部同步代码可以继续执行。
        2. 如果等待的 Promise 被拒绝，await 会在当前位置抛出异常。如果它位于 try 代码块中，就可以被对应的 catch 捕获。
        3. finally 无论正常执行、发生异常，还是执行 return，通常都会运行。 它适合执行资源释放、关闭 Loading 等清理操作。
        4. 如果 catch 处理异常后正常返回，异步函数可以恢复成功状态；如果异常没有被捕获，或者重新抛出，
        async 函数返回的 Promise 就会被拒绝。
        5. 即使等待的是已经拒绝的 Promise，await 后面的异常处理也不会在当前同步调用中立即执行，而是通过微任务恢复。 
    */

    // 如果调用 run() 的地方想知道执行是否成功，应该如何获取它返回的 Promise 的最终结果？
    /*
        async 函数调用后一定会返回一个 Promise，因此调用方可以通过 .then()、.catch()，或者 await 配合 try...catch 来获取最终结果。
        但是在这段代码中，虽然 await Promise.reject("error") 会抛出拒绝原因，但这个错误已经被 run() 内部的 catch 捕获，并且没有继续抛出。
        因此，run() 最终会正常结束，它返回的 Promise 是 Fulfilled 状态，兑现值为 undefined。
        如果希望调用方知道执行是否真正成功，通常有两种方式：
        1. 发生错误后重新抛出异常，让 run() 返回 Rejected Promise，由调用方使用 .catch() 处理。
        2. 显式返回一个结果对象，例如 { success: true } 或 { success: false, error }，让调用方通过返回值判断成功与否。
    */
</script>
</html>
