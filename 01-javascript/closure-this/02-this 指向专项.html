<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this 指向专项</title>
</head>
<body>
    
</body>
<script>
    // ============this 指向专项=============
    // 1. 对象方法调用
    console.log("1. 对象方法调用")
    const user = {
        name: "Alice",

        getName() {
            return this.name;
        }
    };

    console.log(user.getName()); // Alice

    // 对象方法调用中的 this
    /*
        在 Javascript 中，this 表示函数执行时的上下文。对于普通函数，this 的值主要由函数的调用方式决定，
        而不是函数定义在哪里决定。
        1. 当函数通过对象的方法调用执行时，例如 obj.method()，函数内部的 this 通常指向点号前面的对象 obj，
        这种情况称为隐式绑定。
        2. 如果将对象方法单独赋值给一个变量，再直接调用，就有可能丢失原来的 this 绑定。在严格模式下，
        普通函数直接调用时的 this 是 undefined，在浏览器的非严格模式下，通常会指向全局对象。
        3. 可以使用 call()、apply() 或 bind() 显式指定普通函数的 this。
        4. 箭头函数没有自己的 this 绑定，而是从定义时的外层词法环境中获取 this。因此，箭头函数不适合直接作为依赖自身 this 的对象方法。
    */

    // 2. 方法提取后调用
    console.log("2. 方法提取后调用")
    const user1 = {
        name: "Alice",

        getName() {
            return this?.name ?? "unknown";
        }
    };

    const fn = user1.getName;  // 普通函数提取出来再调用，它的 this 指向 window，而 window.name 为空字符串

    console.log(fn()); // undefined ❌   "" ✅

    // 函数脱离对象调用、严格模式下的 this
    /*
        在 JavaScript 中，对于普通函数，this 的指向主要由函数的调用方式决定，而不是由函数定义在哪里决定。
        1. 当函数通过 obj.method() 的形式调用时，this 通常指向调用该方法的对象 obj，这称为隐式绑定。
        2. 如果把对象方法赋值给另一个变量，再通过该变量直接调用，就会丢失原来的隐式绑定。 因为赋值操作只取得函数值，并不会把原来的对象一起绑定进去。
        3. 在严格模式下，普通函数直接调用时，this 是 undefined。 因此，如果函数内部访问 this.name，就会抛出 TypeError。
        4. 在非严格模式下，普通函数直接调用时，如果没有其他绑定规则生效，this 通常会被替换为全局对象。
    */

    // 3. call 和 apply
    console.log("3. call 和 apply")
    function sum(a, b) {
        return this.base + a + b;
    }

    const obj = { base: 10 };

    console.log(sum.call(obj, 1, 2)); // 13
    console.log(sum.apply(obj, [3, 4])); // 17

    // 显示绑定、传参方式
    /*
        Javascript 中，对于普通函数，可以通过 call()、apply() 和 bine() 显式指定函数执行时的 this。
        1. call() 会立即执行函数，它的第一个参数用于指定 this，后面的参数需要逐个传入，例如 fn.call(obj, a, b)
        2. apply() 也会立即执行函数。它与 call() 的主要区别在于传参方式：除了第一个 this 参数外，
        其他参数需要通过数组或类数组对象一次性传入，例如 fn.apply(obj, [a, b])。
        3. bind() 不会立即执行函数，而是返回一个新的绑定函数。 它可以固定 this，还可以提前固定部分参数，
        之后调用新函数时再传入剩余参数。
        对于普通函数，显式绑定通常比对象调用的隐式绑定优先级更高。
    */

    // 4. bind 是否可以被 call 覆盖？
    console.log("4. bind 是否可以被 call 覆盖？")
    function getName() {
        return this.name;
    }

    const obj1 = { name: "Alice" };
    const obj2 = { name: "Bob" };

    const boundFn = getName.bind(obj1);

    console.log(boundFn());          // Alice
    console.log(boundFn.call(obj2)); // Bob ❌  Alice ✅   bind 是永久绑定，优先级高于临时绑定的 call 和 apply

    // 绑定函数的 this 规则
    /*
        在 Javascript 中，使用 bind() 调用普通函数时，会返回一个新的绑定函数。
        1. 绑定函数会保存指定的 this 和预先传入的参数，但不会立即执行原函数。
        2. 通过普通方式调用绑定函数时，它会使用第一次 bind() 指定的 this。即使将定函数赋值给其他对象的方法，
        或者使用 call()、apply() 再次指定 this，通常也无法改变原先绑定的 this。
        3. 如果对已经绑定的函数再次调用 bind()，新的 this 不会覆盖第一次绑定的 this，但可以继续绑定额外的参数。
        4. new 是一个重要的例外。如果原函数可以作为构造函数，那么通过 new 调用绑定函数时，预先绑定的 this 会被忽略，
        构造函数会为原函数提供新的实例对象作为 this，但预先绑定的普通参数仍然有效。
    */

    // 5. 箭头函数的 this
    console.log("5. 箭头函数的 this")
    function createFn() {
        return () => this.name;
    } // 注意 createFn() 是普通函数

    const obj11 = { name: "Alice" };
    const obj22 = { name: "Bob" };

    const fn1 = createFn.call(obj11); // // 这里的 call() 调用的是普通函数 createFn

    console.log(fn1());            // Alice
    console.log(fn1.call(obj22));  // Bob ❌  Alice ✅  

    // 箭头函数的词法 this、call() 对箭头函数的作用
    /*
        1. 普通函数的 this 主要由调用方式决定。 例如通过 obj.method() 调用时，this 通常指向 obj；
        使用 call()、apply() 或 bind()，也可以显式指定普通函数的 this。
        2. 箭头函数没有自己的 this 绑定，而是使用定义时外层词法环境中的 this。 这称为词法 this。
        3. 使用 call()、apply() 或 bind() 不能改变箭头函数的 this。 因为箭头函数不会根据调用方式重新绑定 this，
        这些方法传入的 thisArg 对箭头函数不起作用。
        4. 需要注意，这些方法虽然不能改变箭头函数的 this，但仍然可以正常传递参数。 例如 
        arrow.call(obj, 1, 2) 中的 obj 不会成为箭头函数的 this，但 1 和 2 仍然会传给函数。
    */

    // 6. 普通函数与箭头函数混合
    console.log("6. 普通函数与箭头函数混合")
    const obj3 = {
        name: "Alice",

        run() {
            const normal = function () {
                return this?.name ?? "unknown";
            };

            const arrow = () => this.name;

            console.log(normal()); // 这其实是普通函数的独立调用
            console.log(arrow());
        }
    };

    obj3.run(); // unknown  Alice ❌  ""  Alice ✅  

    // 普通函数的调用方式与箭头函数的外层 this
    /*
        1.普通函数的 this 主要取决于调用方式。 例如，通过 obj.method() 调用时，this 通常指向 obj；
        使用 call()、apply() 或 bind() 可以显式指定 this；在严格模式下直接调用普通函数时，this 是 undefined。
        2. 箭头函数没有自己的 this 绑定，而是使用定义位置外层词法环境中的 this。 因此，箭头函数的 this 不会因为它自己的调用方式发生变化。
        3. 如果箭头函数定义在普通函数内部，那么它使用的是该普通函数执行时的 this。 而普通函数的 this 又由普通函数的调用方式决定。
        所以，虽然箭头函数的 this 是词法绑定的，但是我们仍然可以通过改变外层普通函数的调用方式，影响它内部创建的箭头函数最终使用哪个 this。
        4. call()、apply() 和 bind() 无法直接改变已经创建的箭头函数的 this，但可以通过影响外层普通函数的 this，间接影响新创建的箭头函数。
    */

    // 7. 方法赋值给另一个对象
    console.log("7. 方法赋值给另一个对象")
    const obj111 = {
        name: "Alice",

        getName() {
            return this.name;
        }
    };

    const obj222 = {
        name: "Bob",
        getName: obj111.getName
    };

    console.log(obj111.getName()); // Alice
    console.log(obj222.getName()); // Alice ❌  Bob ✅  普通函数的 this 取决于调用位置

    // 方法的定义位置与调用位置
    /*
        1. 函数的定义位置决定它的词法作用域。函数内部访问普通变量时，会按照函数定义时建立的词法作用域链查找，
        而不是根据调用位置查找。
        2. 普通函数的 this 主要由调用方式决定。
        3. 将对象方法赋值给另一个对象后，通过新对象调用，this 通常会指向新对象。普通函数的 this 不会在定义时自动绑定到某个对象。
        4. 箭头函数没有自己的 this，而是使用定义时外层词法环境中的 this。
    */

    // 8. new 与 bind 的优先级
    console.log("8. new 与 bind 的优先级")
    function Person(name) {
        this.name = name;
    }

    const obj4 = { name: "Original" };

    const BoundPerson = Person.bind(obj4); // 表示普通调用 BoundPerson() 时，this 会默认指向 obj4

    const person = new BoundPerson("Alice");

    console.log(person.name); // Alice
    console.log(obj4.name);   // Original
    console.log(person instanceof Person); // true

    // 构造函数调用、bind、new 的绑定优先级
    /*
        1. new 调用会触发构造函数的构造行为。对于普通的构造函数，Javascript 通常会创建一个新对象，并使构造函数内部的 this 指向这个新对象。
        2. bind() 可以创建一个绑定函数，预先保存指定的 this 和部分参数。 在普通调用时，即使使用 call()、apply() 或者再次 bind()，通常也不能覆盖第一次绑定的 this。
        3. 当使用 new 调用一个通过 bind() 创建的可构造函数时，预先绑定的 this 会被忽略。构造函数使用新创建的实例作为 this，
        但 bind() 预先绑定的普通参数仍然会传入构造函数。
    */

    // 9. 数组回调函数中的 this
    console.log("9. 数组回调函数中的 this")
    const obj5 = {
        base: 10,

        add(value) {
            return this.base + value;
        }
    };

    const numbers = [1, 2, 3];

    console.log(numbers.map(obj5.add, obj5)); // [11, 12, 13]   第二个参数是执行回调函数时的 this

    // Array.prototype.map() 的第二个参数 thisArg
    /*
        Array.prototype.map() 接收两个参数，第一个是回调函数，第二个事可选的 thisArg，
        用于指定执行回调函数时的 this。
        1. map() 会遍历数组中存在的元素，对每个元素执行回调函数，并根据回调函数的返回值生成一个新数组。
        2. 对于普通回调函数，thisArg 可以指定回调执行时的 this。
        3. thisArg 不会作为回调函数的普通参数传入。map() 回调函数接收的三个参数依次是当前元素 value、
        当前索引 index 和原数组 array。
        4. 如果回调函数是箭头函数，那么 thisArg 无法改变它的 this。
    */

    // 10. this 综合分析
    console.log("10. this 综合分析")
    const obj6 = {
        value: 1,

        run() {
            const normal = function () {
                return this?.value ?? 0;
            };

            const arrow = () => this.value;

            return [
                normal.call({ value: 2 }),
                arrow.call({ value: 3 })
            ];
        }
    };

    console.log(obj6.run()); // [2, 1] 箭头函数没有自己的 this，会捕获定义时外层 run() 的 this，call 也不能改变箭头函数的 this

    // 普通函数显式绑定与箭头函数词法绑定同时出现
    /*
        1. 普通函数的 this 主要由调用方式决定。 我们可以通过 call()、apply() 或 bind() 显式指定普通函数执行时的 this。
        2. 箭头函数没有自己的 this 绑定，而是使用定义位置外层词法环境中的 this。 它不会根据自身的调用方式重新绑定 this。
        3. 如果箭头函数定义在普通函数内部，那么它会使用外层普通函数执行时的 this。 因此，可以通过显式绑定外层普通函数的 this，
        间接影响其内部创建的箭头函数。
        4. 如果箭头函数已经创建，再对箭头函数本身调用 call()、apply() 或 bind()，就无法改变它的词法 this。
    */
</script>
</html>
